[project]
name = "hekmo"
version = "0.1.0"
description = "Lightning fast ADR drafting for busy teams."
readme = "README.md"
requires-python = ">=3.12"
license = "EPL-2.0"
authors = [
    { name = "Sherwin Varghese"}
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "click>=8.4.1",
    "openai>=2.32.0",
    "pyfiglet>=1.0.4",
    "requests>=2.33.1",
    "rich>=15.0.0",
]


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]

[project.scripts]
hekmo = "hekmo.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["hekmo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
